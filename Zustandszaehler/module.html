<style>
    /* Schrift, Schriftgröße, Ränder und Farben kommen von der Visualisierung, nichts davon wird hier überschrieben */
    .zsz {
        --on: var(--accent-color);
        --ok: #2fb344;
        --line: color-mix(in srgb, var(--content-color) 14%, transparent);
        --soft: color-mix(in srgb, var(--content-color) 6%, transparent);
        --muted: color-mix(in srgb, var(--content-color) 60%, transparent);
        display: flex;
        flex-direction: column;
        gap: 0.8em;
        box-sizing: border-box;
        overflow: hidden;
        position: relative;
        z-index: 0;
        font-family: inherit;
        font-size: inherit;
        color: var(--content-color);
        /* Die Kachel richtet ihr Layout nach dem verfügbaren Platz aus (Container-Abfragen weiter unten, Maße in em) */
        container-type: size;
        container-name: zsz;
        width: 100%;
    }

    /* Ganze Kachel einfärben: Die Fläche liegt hinter dem Inhalt und deckt die gesamte Kachel ab.
       Name und Maximieren-Symbol der Visualisierung bleiben darüber sichtbar. In der großen Ansicht entfällt das, damit die Liste lesbar bleibt. */
    .zsz-fill:not(.zsz-big)::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background: var(--hero);
    }

    .zsz-fill:not(.zsz-big) .zsz-hero {
        background: transparent;
        border-radius: 0;
    }

    .zsz * {
        box-sizing: border-box;
    }

    /* Kleine Kachel: farbige Fläche mit der Zahl in der Mitte */
    .zsz-hero {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.2em;
        padding: 0.8em;
        border-radius: 1.1em;
        background: var(--hero);
        color: var(--heroText);
        text-align: center;
    }

    .zsz-number {
        font-size: 4.2em;
        line-height: 1;
        font-weight: 400;
    }

    /* Ist nichts aktiv, steht statt der Zahl "OK" */
    .zsz-ok {
        color: var(--okText);
        font-weight: 700;
    }

    .zsz-headline {
        font-weight: 700;
        font-size: 1.05em;
    }

    .zsz-sub {
        font-size: 0.8em;
        opacity: 0.85;
    }

    /* Große (maximierte) Ansicht: kompakter Kopf und die Liste der Variablen */
    .zsz-big .zsz-hero {
        flex: none;
        flex-direction: row;
        justify-content: flex-start;
        gap: 1em;
        text-align: left;
        padding: 0.8em 1.2em;
    }

    .zsz-big .zsz-number {
        font-size: 3em;
        min-width: 1.1em;
        text-align: center;
    }

    .zsz-heroText {
        min-width: 0;
    }

    .zsz-tools {
        flex: none;
        display: none;
        justify-content: flex-end;
    }

    .zsz-big .zsz-tools {
        display: flex;
    }

    .zsz-toggle {
        font: inherit;
        font-size: 0.8em;
        color: var(--content-color);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 2em;
        padding: 0.3em 0.9em;
        cursor: pointer;
    }

    .zsz-toggle:hover {
        background: var(--soft);
    }

    .zsz-list {
        display: none;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        flex-direction: column;
        gap: 0.9em;
        /* Scrollbalken schmal und dezent in den Farben der Visualisierung, Abstand zum Inhalt (standards/TILE_VISUALIZATION.md) */
        padding-right: 0.7em;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--content-color) 30%, transparent) transparent;
    }

    .zsz-list::-webkit-scrollbar {
        width: 0.35em;
    }

    .zsz-list::-webkit-scrollbar-track {
        background: transparent;
    }

    .zsz-list::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--content-color) 30%, transparent);
        border-radius: 0.2em;
    }

    .zsz-list::-webkit-scrollbar-thumb:hover {
        background: var(--accent-color);
    }

    .zsz-big .zsz-list {
        display: flex;
    }

    .zsz-groupName {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-weight: 700;
        padding: 0 0.2em 0.3em;
        border-bottom: 1px solid var(--line);
    }

    .zsz-groupCount {
        font-size: 0.85em;
        color: var(--muted);
        font-weight: 400;
    }

    .zsz-row {
        display: flex;
        align-items: center;
        gap: 0.7em;
        padding: 0.45em 0.2em;
        border-bottom: 1px solid var(--line);
    }

    .zsz-dot {
        flex: none;
        width: 0.7em;
        height: 0.7em;
        border-radius: 50%;
        background: color-mix(in srgb, var(--content-color) 25%, transparent);
    }

    .zsz-on .zsz-dot {
        background: var(--on);
        box-shadow: 0 0 0.5em color-mix(in srgb, var(--on) 70%, transparent);
    }

    .zsz-na .zsz-dot {
        background: transparent;
        border: 1px dashed var(--muted);
    }

    .zsz-rowName {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .zsz-off .zsz-rowName,
    .zsz-na .zsz-rowName {
        color: var(--muted);
    }

    .zsz-na .zsz-rowName {
        font-style: italic;
    }

    /* Badge für den Zustand: aktiv in der Farbe für aktiv, nicht aktiv in der Farbe für "nichts aktiv" */
    .zsz-badge {
        flex: none;
        font-size: 0.78em;
        font-weight: 700;
        line-height: 1.3;
        padding: 0.15em 0.75em;
        border-radius: 2em;
        white-space: nowrap;
        color: var(--clear);
        background: color-mix(in srgb, var(--clear) 16%, transparent);
        border: 1px solid color-mix(in srgb, var(--clear) 40%, transparent);
    }

    .zsz-on .zsz-badge {
        color: #fff;
        background: var(--on);
        border-color: var(--on);
    }

    .zsz-na .zsz-badge {
        color: var(--muted);
        background: transparent;
        border: 1px dashed var(--muted);
        font-weight: 400;
        font-style: italic;
    }

    /* Steuerelemente nach der Darstellung der Variable. Reicht die Breite nicht, rutschen sie unter den Namen. */
    .zsz-row {
        flex-wrap: wrap;
    }

    .zsz-rowName {
        flex: 1 1 8em;
    }

    .zsz-ctl {
        flex: none;
        display: flex;
        align-items: center;
        gap: 0.6em;
        margin-left: auto;
    }

    .zsz-seg {
        flex: none;
        display: flex;
        margin-left: auto;
        border-radius: 0.5em;
        overflow: hidden;
        background: color-mix(in srgb, var(--on) 14%, transparent);
    }

    .zsz-ctl .zsz-seg {
        margin-left: 0;
    }

    .zsz-segBtn {
        font: inherit;
        font-size: 0.82em;
        color: var(--seg, var(--on));
        background: transparent;
        border: 0;
        padding: 0.4em 0.85em;
        cursor: pointer;
        white-space: nowrap;
    }

    .zsz-segBtn:hover {
        background: color-mix(in srgb, var(--seg, var(--on)) 18%, transparent);
    }

    .zsz-segBtn.zsz-segOn {
        background: var(--seg, var(--on));
        color: #fff;
        font-weight: 700;
    }

    .zsz-hint {
        font-size: 0.8em;
        color: var(--muted);
        white-space: nowrap;
    }

    .zsz-range {
        accent-color: var(--on);
        width: 11em;
    }

    .zsz-input {
        flex: none;
        margin-left: auto;
        font: inherit;
        font-size: 0.85em;
        color: var(--content-color);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 0.5em;
        padding: 0.3em 0.6em;
        max-width: 14em;
    }

    .zsz-color {
        flex: none;
        margin-left: auto;
        width: 3em;
        height: 1.8em;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 0.5em;
        background: transparent;
        cursor: pointer;
    }

    .zsz-switch {
        flex: none;
        position: relative;
        width: 2.4em;
        height: 1.3em;
        padding: 0;
        border: 0;
        border-radius: 1em;
        background: color-mix(in srgb, var(--content-color) 25%, transparent);
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .zsz-switch::after {
        content: '';
        position: absolute;
        top: 0.15em;
        left: 0.15em;
        width: 1em;
        height: 1em;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.2s ease;
    }

    .zsz-on .zsz-switch {
        background: var(--on);
    }

    .zsz-on .zsz-switch::after {
        transform: translateX(1.1em);
    }

    .zsz-switch:disabled {
        opacity: 0.5;
        cursor: wait;
    }

    .zsz-empty {
        padding: 2em 1em;
        text-align: center;
        color: var(--muted);
    }

    .zsz-none {
        padding: 0.6em 0.2em;
        color: var(--muted);
    }

    /* Kleine Felder: erst entfällt die Zeile "x von y", dann die Überschrift, zuletzt bleibt die Zahl allein.
       Die Höhe ist die Höhe der Kachel innerhalb der Ränder der Visualisierung. */
    @container zsz (max-height: 10em) {
        .zsz:not(.zsz-big) .zsz-hero {
            padding: 0.4em;
            gap: 0.1em;
        }

        .zsz:not(.zsz-big) .zsz-number {
            font-size: 3em;
        }

        .zsz:not(.zsz-big) .zsz-sub {
            display: none;
        }

        .zsz:not(.zsz-big) .zsz-headline {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.9em;
        }
    }

    @container zsz (max-height: 6.5em) {
        .zsz:not(.zsz-big) .zsz-headline {
            display: none;
        }

        .zsz:not(.zsz-big) .zsz-number {
            font-size: 2.6em;
        }
    }
</style>

<div class="zsz" id="zsz"></div>

<script>
    (function () {
        var root = document.getElementById('zsz');
        var state = null;
        var showAll = false;
        var justSent = false;
        var pending = false;

        // Der Browser-Speicher kann fehlen oder eine Ausnahme werfen, die Kachel funktioniert auch ohne
        try {
            showAll = localStorage.getItem('zsz.showAll') === '1';
        } catch (e) {
        }

        // Ab dieser Höhe (in Zeilenhöhen der Visualisierung) gilt die Kachel als maximiert und zeigt die Liste
        var BIG_HEIGHT_EM = 24;

        function el(tag, className, text) {
            var node = document.createElement(tag);
            if (className) {
                node.className = className;
            }
            if (text !== undefined) {
                node.textContent = text;
            }
            return node;
        }

        // Die Kachel füllt den Platz innerhalb der Ränder, die die Visualisierung am body setzt
        function fit() {
            var style = getComputedStyle(document.body);
            var space = parseFloat(style.marginTop) + parseFloat(style.marginBottom);
            var height = Math.max(0, window.innerHeight - space);
            root.style.height = height + 'px';
            var big = height / (parseFloat(style.fontSize) || 15) >= BIG_HEIGHT_EM;
            root.classList.toggle('zsz-big', big);
        }

        function buildHero(data) {
            var clear = data.active === 0 && data.total > 0;
            var hero = el('div', 'zsz-hero');
            var custom = data.colors;

            // Ohne eigene Farben gilt das Design der Visualisierung: Akzentfarbe bei aktiv, neutrale Fläche bei nichts aktiv
            if (clear) {
                root.style.setProperty('--hero', custom ? custom.clear : 'color-mix(in srgb, var(--content-color) 8%, transparent)');
                root.style.setProperty('--heroText', custom ? '#fff' : 'var(--content-color)');
                root.style.setProperty('--okText', custom ? '#fff' : 'var(--ok)');
            } else {
                root.style.setProperty('--hero', 'var(--on)');
                root.style.setProperty('--heroText', '#fff');
            }

            if (clear) {
                hero.appendChild(el('div', 'zsz-number zsz-ok', data.texts.ok));
            } else {
                hero.appendChild(el('div', 'zsz-number', String(data.active)));
            }

            var text = el('div', 'zsz-heroText');
            text.appendChild(el('div', 'zsz-headline', clear ? data.texts.clear : data.texts.headline));
            text.appendChild(el('div', 'zsz-sub', data.active + ' ' + data.texts.of + ' ' + data.total));
            hero.appendChild(text);
            return hero;
        }

        // Schickt einen gewählten Wert an das Modul. Das Modul prüft ihn und schreibt über die Aktion der Variable.
        function sendValue(item, value) {
            justSent = true;
            requestAction('Set', JSON.stringify({id: item.id, value: value}));
        }

        function sameValue(a, b) {
            if (typeof a === 'number' && typeof b === 'number') {
                return Math.abs(a - b) < 0.000001;
            }
            return String(a) === String(b);
        }

        // Segmentleiste: ein Knopf je Eintrag, der aktive ist gefüllt, eine eigene Farbe färbt den Knopf
        function buildSegments(entries, activeIndex, onPick) {
            var seg = el('div', 'zsz-seg');
            entries.forEach(function (entry, index) {
                var button = el('button', 'zsz-segBtn' + (index === activeIndex ? ' zsz-segOn' : ''), entry.label);
                button.type = 'button';
                if (entry.color) {
                    button.style.setProperty('--seg', entry.color);
                }
                button.addEventListener('click', function () {
                    onPick(entry);
                });
                seg.appendChild(button);
            });
            return seg;
        }

        // Steuerelement nach der Darstellung der Variable: Auswahl, Rollladen, Schieberegler, Farbe oder Eingabe
        function buildControl(item, texts) {
            var c = item.c;
            var entries;
            var active = -1;

            if (c.t === 'enum') {
                c.o.forEach(function (option, index) {
                    if (sameValue(option.v, c.v)) {
                        active = index;
                    }
                });
                if (c.o.length > 6) {
                    var select = el('select', 'zsz-input');
                    if (active < 0) {
                        var blank = el('option', '', item.fv || '-');
                        blank.value = '';
                        select.appendChild(blank);
                    }
                    c.o.forEach(function (option, index) {
                        var entry = el('option', '', option.c);
                        entry.value = String(index);
                        select.appendChild(entry);
                    });
                    select.value = active < 0 ? '' : String(active);
                    select.addEventListener('change', function () {
                        if (select.value !== '') {
                            sendValue(item, c.o[Number(select.value)].v);
                        }
                    });
                    return select;
                }
                entries = c.o.map(function (option) {
                    return {label: option.c, color: option.k, value: option.v};
                });
                return buildSegments(entries, active, function (entry) {
                    sendValue(item, entry.value);
                });
            }

            if (c.t === 'shutter') {
                entries = c.o.map(function (option) {
                    var label = option.p === 0 ? texts.shutterOpen : option.p === 100 ? texts.shutterClosed : option.p + ' %';
                    return {label: label, value: option.v, percent: option.p};
                });
                // Der Knopf, der der Position am nächsten liegt, ist aktiv, aber nur bis 1,5 Prozentpunkte Abstand
                var distance = 1.5;
                entries.forEach(function (entry, index) {
                    if (Math.abs(entry.percent - c.p) <= distance) {
                        distance = Math.abs(entry.percent - c.p);
                        active = index;
                    }
                });
                var shutter = el('div', 'zsz-ctl');
                if (active < 0 && item.fv) {
                    shutter.appendChild(el('span', 'zsz-hint', item.fv));
                }
                shutter.appendChild(buildSegments(entries, active, function (entry) {
                    sendValue(item, entry.value);
                }));
                return shutter;
            }

            if (c.t === 'slider') {
                var box = el('div', 'zsz-ctl');
                var label = el('span', 'zsz-hint', item.fv || String(c.v));
                var range = el('input', 'zsz-range');
                range.type = 'range';
                range.min = c.min;
                range.max = c.max;
                range.step = c.step;
                range.value = c.v;
                range.addEventListener('input', function () {
                    label.textContent = range.value;
                });
                // Gesendet wird beim Loslassen, nicht bei jeder Bewegung
                range.addEventListener('change', function () {
                    sendValue(item, Number(range.value));
                });
                box.appendChild(label);
                box.appendChild(range);
                return box;
            }

            if (c.t === 'color') {
                var color = el('input', 'zsz-color');
                color.type = 'color';
                color.value = '#' + ('000000' + Number(c.v).toString(16)).slice(-6);
                color.addEventListener('change', function () {
                    sendValue(item, parseInt(color.value.slice(1), 16));
                });
                return color;
            }

            if (c.t === 'text') {
                var input = el('input', 'zsz-input');
                input.type = 'text';
                input.value = String(c.v);
                if (c.num) {
                    input.inputMode = 'decimal';
                }
                input.addEventListener('change', function () {
                    sendValue(item, c.num ? Number(input.value.replace(',', '.')) : input.value);
                });
                return input;
            }

            return null;
        }

        function buildRow(item, texts) {
            var cls = item.a === null ? 'zsz-na' : item.a ? 'zsz-on' : 'zsz-off';
            var row = el('div', 'zsz-row ' + cls);
            row.appendChild(el('span', 'zsz-dot'));
            row.appendChild(el('span', 'zsz-rowName', item.n));

            // Schaltbare Variablen zeigen ihren Zustand am Schalter, alle anderen rechts als Badge in der Farbe des Zustands
            var control = item.c && item.a !== null ? buildControl(item, texts) : null;
            if (control) {
                row.appendChild(control);
            } else if (!(item.s === 1 && item.a !== null)) {
                row.appendChild(el('span', 'zsz-badge', item.a === null ? texts.missing : item.a ? texts.unit : texts.off));
            }

            if (item.s === 1 && item.a !== null) {
                // Schaltbare Variablen lassen sich hier umschalten. Das Ergebnis kommt als neue Daten vom Modul zurück.
                var toggle = el('button', 'zsz-switch');
                toggle.type = 'button';
                toggle.setAttribute('role', 'switch');
                toggle.setAttribute('aria-checked', item.a ? 'true' : 'false');
                toggle.title = item.a ? texts.unit : texts.off;
                toggle.addEventListener('click', function () {
                    toggle.disabled = true;
                    requestAction('Toggle', String(item.id));
                    // Kommt keine Antwort, etwa weil das Gerät nicht erreichbar ist, wird der Schalter wieder frei
                    setTimeout(function () {
                        toggle.disabled = false;
                    }, 4000);
                });
                row.appendChild(toggle);
            }
            return row;
        }

        // Die Reihenfolge ist die der Liste in der Konfiguration. Inaktive Elemente erscheinen nur bei "Alle anzeigen",
        // nicht verfügbare immer.
        function buildList(data) {
            var list = el('div', 'zsz-list');
            var multiple = data.groups.length > 1;

            data.groups.forEach(function (group) {
                var items = group.items.filter(function (item) {
                    return item.a === 1 || item.a === null || showAll;
                });

                var section = el('div', 'zsz-section');
                if (multiple) {
                    var name = el('div', 'zsz-groupName', group.name);
                    name.appendChild(el('span', 'zsz-groupCount', group.active + ' ' + data.texts.of + ' ' + group.items.length));
                    section.appendChild(name);
                }
                if (items.length === 0) {
                    section.appendChild(el('div', 'zsz-none', data.texts.noneActive));
                }
                items.forEach(function (item) {
                    section.appendChild(buildRow(item, data.texts));
                });
                list.appendChild(section);
            });
            return list;
        }

        function render() {
            if (!state) {
                return;
            }
            root.style.setProperty('--on', state.colors ? state.colors.active : 'var(--accent-color)');
            root.style.setProperty('--clear', state.colors ? state.colors.clear : 'var(--ok)');
            root.classList.toggle('zsz-fill', state.fill === true);
            root.textContent = '';

            if (state.total === 0) {
                root.appendChild(el('div', 'zsz-empty', state.texts.empty));
                fit();
                return;
            }

            root.appendChild(buildHero(state));

            var tools = el('div', 'zsz-tools');
            var toggle = el('button', 'zsz-toggle', showAll ? state.texts.showActive : state.texts.showAll);
            toggle.type = 'button';
            toggle.addEventListener('click', function () {
                showAll = !showAll;
                try {
                    localStorage.setItem('zsz.showAll', showAll ? '1' : '0');
                } catch (e) {
                }
                render();
            });
            tools.appendChild(toggle);
            root.appendChild(tools);

            root.appendChild(buildList(state));
            fit();
        }

        // Wird beim Laden mit den Startdaten und danach bei jeder Änderung vom Modul aufgerufen
        window.handleMessage = function (json) {
            try {
                state = JSON.parse(json);
            } catch (e) {
                return;
            }
            // Wer gerade in ein Feld tippt oder einen Regler zieht, wird nicht unterbrochen. Nach dem Absenden eines
            // Werts zeichnet die nächste Meldung sofort neu.
            if (!justSent && isEditing()) {
                pending = true;
                return;
            }
            justSent = false;
            pending = false;
            render();
        };

        function isEditing() {
            var element = document.activeElement;
            return element && root.contains(element) && (element.tagName === 'INPUT' || element.tagName === 'SELECT');
        }

        root.addEventListener('focusout', function () {
            if (pending && !isEditing()) {
                pending = false;
                render();
            }
        });

        window.addEventListener('resize', fit);
        fit();
    })();
</script>
